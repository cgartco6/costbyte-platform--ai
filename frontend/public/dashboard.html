<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects – CostByte</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6">
<div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-black">📁 My Ventures</h1>
        <a href="/frontend/public/index.html" class="bg-indigo-600 text-white px-4 py-2 rounded-full text-sm">+ New Venture</a>
    </div>
    <div id="projectsList" class="grid md:grid-cols-2 gap-6"></div>
</div>
<script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/'; }
    fetch('/api/projects/my', { headers: { 'Authorization': `Bearer ${token}` } })
        .then(res => res.json())
        .then(projects => {
            const container = document.getElementById('projectsList');
            if (!projects.length) { container.innerHTML = '<p class="text-slate-500 col-span-2 text-center">No projects yet. Start one!</p>'; return; }
            projects.forEach(p => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow p-5';
                card.innerHTML = `
                    <div class="font-bold text-lg">${p.description.substring(0, 80)}</div>
                    <div class="text-sm text-slate-500 mt-1">Package: ${p.package} | Price: R${p.price}</div>
                    <div class="text-xs mt-2">Status: <span class="font-semibold ${p.payment_status === 'paid' ? 'text-green-600' : 'text-orange-600'}">${p.payment_status}</span></div>
                    ${p.generated_assets ? `<a href="${p.generated_assets}" class="mt-3 inline-block bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold">📥 Download ZIP</a>` : '<div class="text-xs text-slate-400 mt-2">Waiting for payment → generation</div>'}
                `;
                container.appendChild(card);
            });
        });
</script>
</body>
</html>
