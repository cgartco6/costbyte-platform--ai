<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ventures – CostByte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .project-card { transition: transform 0.2s, box-shadow 0.2s; }
        .project-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-6">
                    <a href="/" class="text-2xl font-black bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">CostByte</a>
                    <a href="/index.html" class="text-sm text-slate-600 hover:text-indigo-600">Builder</a>
                    <a href="/cart.html" class="text-sm text-slate-600 hover:text-indigo-600">Cart</a>
                    <a href="/revenue-dashboard.html" class="text-sm text-slate-600 hover:text-indigo-600">Revenue</a>
                </div>
                <button id="logoutBtn" class="text-sm bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-full transition">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800">My Ventures</h1>
                <p class="text-slate-500 mt-1">All your AI‑generated startup packages</p>
            </div>
            <a href="/index.html" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl transition shadow-sm">+ New Venture</a>
        </div>

        <div id="projectsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400">Loading your projects...</div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        (async function() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '/'; return; }
            try {
                const projects = await apiCall('/projects/my');
                const container = document.getElementById('projectsGrid');
                if (!projects || projects.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm"><svg class="mx-auto h-12 w-12 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 5h18a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg><p class="mt-2 text-slate-500">No ventures yet.</p><a href="/index.html" class="mt-4 inline-block text-indigo-600 font-semibold">Create your first venture →</a></div>`;
                    return;
                }
                container.innerHTML = projects.map(p => `
                    <div class="project-card bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div class="p-5">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="inline-block px-2 py-1 text-xs font-bold rounded-full ${p.payment_status === 'paid' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                                        ${p.payment_status === 'paid' ? '✓ Paid' : (p.payment_status === 'pending_eft' ? '⏳ EFT Pending' : '💳 Unpaid')}
                                    </span>
                                    <span class="inline-block ml-2 px-2 py-1 text-xs font-bold rounded-full bg-slate-100 text-slate-600">${p.package || 'Standard'}</span>
                                </div>
                                <div class="text-right"><div class="text-2xl font-black text-slate-800">R${parseFloat(p.price).toLocaleString()}</div><div class="text-[10px] text-slate-400">${new Date(p.created_at).toLocaleDateString()}</div></div>
                            </div>
                            <h3 class="font-bold text-lg mt-3 line-clamp-2">${escapeHtml(p.description.substring(0, 100))}</h3>
                            <div class="mt-4 pt-4 border-t border-slate-100 flex justify-between items-center">
                                ${p.generated_assets ? `<a href="${p.generated_assets}" class="text-indigo-600 hover:text-indigo-800 text-sm font-semibold flex items-center gap-1">📥 Download ZIP</a>` : `<span class="text-slate-400 text-xs">⚙️ ${p.payment_status === 'paid' ? 'Generating assets...' : 'Complete payment to generate'}</span>`}
                                ${p.payment_status !== 'paid' && p.payment_status !== 'pending_eft' ? `<button onclick="window.location.href='/index.html?project=${p.id}'" class="text-indigo-600 text-sm font-semibold">Pay now →</button>` : ''}
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) { console.error(err); document.getElementById('projectsGrid').innerHTML = '<div class="col-span-full text-center text-red-500">Failed to load projects. Please refresh.</div>'; }
        })();
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        document.getElementById('logoutBtn')?.addEventListener('click', () => { localStorage.removeItem('token'); window.location.href = '/'; });
    </script>
</body>
</html>
