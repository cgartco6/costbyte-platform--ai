<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Tracker – CostByte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; } .stat-card { transition: transform 0.2s; } .stat-card:hover { transform: translateY(-2px); }</style>
</head>
<body class="bg-slate-50">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-6">
                    <a href="/" class="text-2xl font-black bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">CostByte</a>
                    <a href="/index.html" class="text-sm text-slate-600 hover:text-indigo-600">Builder</a>
                    <a href="/cart.html" class="text-sm text-slate-600 hover:text-indigo-600">Cart</a>
                    <a href="/dashboard.html" class="text-sm text-slate-600 hover:text-indigo-600">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <h1 class="text-3xl font-extrabold text-slate-800 mb-2">💰 Revenue & Targets</h1>
        <p class="text-slate-500 mb-8">Track your earnings, set monthly goals, and watch your progress.</p>
        <div id="statsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10"></div>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-8">
            <h2 class="text-xl font-bold text-slate-800 mb-4">🎯 Set Monthly Revenue Target</h2>
            <div class="flex flex-col sm:flex-row gap-4 items-end">
                <div class="flex-1"><label class="block text-sm font-medium text-slate-600 mb-1">Target (ZAR)</label><input type="number" id="targetInput" class="w-full border border-slate-300 rounded-xl px-4 py-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g., 50000"></div>
                <button id="setTargetBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2 rounded-xl transition">Update Target</button>
            </div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <h2 class="text-xl font-bold text-slate-800 mb-4">📈 Revenue History</h2>
            <canvas id="revenueChart" height="250" class="w-full"></canvas>
        </div>
    </main>
    <script src="/js/app.js"></script>
    <script>
        let currentChart = null;
        async function loadDashboard() {
            try {
                const user = await apiCall('/auth/me');
                const userId = user.userId;
                const data = await apiCall(`/tracking/dashboard/${userId}`);
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card bg-white rounded-2xl shadow-sm border border-slate-100 p-6"><div class="text-slate-500 text-sm">Total Revenue</div><div class="text-4xl font-black text-slate-800 mt-1">R${data.totalRevenue.toFixed(2)}</div></div>
                    <div class="stat-card bg-white rounded-2xl shadow-sm border border-slate-100 p-6"><div class="text-slate-500 text-sm">Monthly Recurring Revenue (MRR)</div><div class="text-4xl font-black text-slate-800 mt-1">R${data.mrr.toFixed(2)}</div></div>
                    <div class="stat-card bg-white rounded-2xl shadow-sm border border-slate-100 p-6"><div class="text-slate-500 text-sm">Progress vs Target</div><div class="text-4xl font-black text-slate-800 mt-1">${data.progress.toFixed(1)}%</div><div class="w-full bg-slate-200 rounded-full h-2 mt-3"><div class="bg-indigo-600 h-2 rounded-full" style="width: ${Math.min(data.progress, 100)}%"></div></div><div class="text-xs text-slate-400 mt-2">Target: R${data.target.toFixed(2)} / month</div></div>
                `;
                const ctx = document.getElementById('revenueChart').getContext('2d');
                if (currentChart) currentChart.destroy();
                currentChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels: data.transactions.map(t => t.recorded_at.split(' ')[0]), datasets: [{ label: 'Revenue (ZAR)', data: data.transactions.map(t => t.amount), borderColor: '#4F46E5', backgroundColor: 'rgba(79,70,229,0.05)', tension: 0.3, fill: true, pointBackgroundColor: '#4F46E5', pointBorderColor: '#fff', pointRadius: 4 }] },
                    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top' }, tooltip: { callbacks: { label: (ctx) => `R${ctx.raw.toFixed(2)}` } } }, scales: { y: { ticks: { callback: (val) => 'R' + val } } } }
                });
            } catch (err) { console.error(err); document.getElementById('statsGrid').innerHTML = '<div class="col-span-full text-red-500">Failed to load revenue data.</div>'; }
        }
        async function setTarget() {
            const monthlyTarget = parseFloat(document.getElementById('targetInput').value);
            if (isNaN(monthlyTarget) || monthlyTarget <= 0) { alert('Please enter a valid amount (ZAR)'); return; }
            await apiCall('/tracking/set-target', { method: 'POST', body: JSON.stringify({ monthlyTarget }) });
            alert('Target updated successfully!');
            loadDashboard();
        }
        document.getElementById('setTargetBtn').addEventListener('click', setTarget);
        loadDashboard();
    </script>
</body>
</html>
